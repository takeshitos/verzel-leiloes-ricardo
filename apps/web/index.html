<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Casa de leilões fictícia com dinheiro simulado, criada para um teste técnico." />
    <title>Casa de Leilões</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura (sem piscar). Sem escolha, vale o do sistema.
      try {
        var tema = localStorage.getItem('tema');
        if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
