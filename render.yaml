# Configuração de deploy no Render (Blueprint).
# Um único web service Node serve o React (build), a API em /api e, mais tarde, o Socket.IO.
# Documentação: docs/DEPLOY.md
services:
  - type: web
    name: verzel-leiloes-ricardo
    runtime: node
    # Plano gratuito: o serviço dorme após 15 min sem tráfego (ver docs/DEPLOY.md).
    plan: free
    # Mesma região do banco no Neon (AWS us-east-1, N. Virginia). Não pode ser alterada depois.
    region: virginia
    branch: main
    # --include=dev: com NODE_ENV=production o npm pularia as devDependencies,
    # e o build precisa delas (TypeScript, Vite).
    buildCommand: npm ci --include=dev && npm run build
    # Igual ao script "npm start", mas sem o npm no meio: o SIGTERM do Render chega direto ao Node.
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Aplica migrações pendentes e roda o seed idempotente antes de aceitar conexões.
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: RUN_SEED_ON_START
        value: "true"
      # Um proxy confiável (o Render termina o HTTPS) e IP real do cliente no cabeçalho
      # CF-Connecting-IP, que o Cloudflare reescreve. Usado no limite de tentativas de login.
      - key: TRUST_PROXY
        value: "1"
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # Segredo: string de conexão do projeto Neon principal. Cadastrar no painel do Render
      # (Environment); o valor nunca entra neste arquivo.
      - key: DATABASE_URL
        sync: false
      # Auditoria (etapa 10, docs/AUDITORIA.md). Segredos: cadastrar no painel (Environment).
      # Chave Ed25519 gerada UMA vez com npm run audit:keygen -w apps/api; nunca regenerar no deploy.
      - key: AUDIT_SIGNING_PRIVATE_KEY
        sync: false
      - key: AUDIT_KEY_VERSION
        value: "1"
      # Âncora independente: string de conexão do SEGUNDO projeto Neon (verzel-leiloes-ancora).
      - key: ANCHOR_DATABASE_URL
        sync: false
      # A versão do Node vem do arquivo .node-version na raiz do repositório.
